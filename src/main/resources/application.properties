spring.application.name=BookShows
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Whether to apply migrations from baseline. Used to run migrations only after a defined `baseline-version`
# Better to set it to false, since we are using flyway from the very beginning
spring.flyway.baseline-on-migrate=false

